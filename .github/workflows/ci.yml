name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    name: Windows tests / Python ${{ matrix.python-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Compile Python files
        run: python -m compileall openlaunchdeck tests

      - name: Capture responsive UI
        if: matrix.python-version == '3.11'
        env:
          QT_QPA_PLATFORM: windows
        run: python scripts/capture_ui.py --output build/ui-qa

      - name: Upload UI review images
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: openlaunchdeck-ui-review
          path: build/ui-qa
          if-no-files-found: error
          retention-days: 7
