        <rect x="0" y="88" width="70" height="70" rx="15"/><rect x="264" y="88" width="70" height="70" rx="15"/>
        <rect x="0" y="176" width="70" height="70" rx="15"/><rect x="264" y="176" width="70" height="70" rx="15"/>
        <rect x="88" y="264" width="70" height="70" rx="15"/><rect x="176" y="264" width="70" height="70" rx="15"/>
      </g>
